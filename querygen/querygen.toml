[[personas.attrs.age]]
table = [["20-29", 12], ["30-44", 45], ["45-64", 35], ["65+", 8]]

# literacy: lay roles with health training keep high literacy (a retired nurse is not "low")
[[personas.attrs.literacy]]
when = { roles = ["retired nurse"] }
fixed = "high"
[[personas.attrs.literacy]]
when = { groups = ["lay"] }
table = [["low", 35], ["medium", 45], ["high", 20]]
[[personas.attrs.literacy]]
when = { groups = ["student"], expertise = [0, 1] }
table = [["medium", 60], ["high", 40]]
[[personas.attrs.literacy]]
when = { expertise = [0, 1] }
table = [["medium", 50], ["high", 50]]
[[personas.attrs.literacy]]
fixed = "high"

# goals: lay people also prepare for appointments and want to see what something looks like (figure needs)
[[personas.attrs.goal]]
when = { groups = ["lay"] }
table = [["decide what to do for a patient or for themself", 35], ["understand how something works", 25], ["check whether a claim is true", 15],
  ["prepare questions for a doctor's appointment", 13], ["see what something looks like", 12]]
[[personas.attrs.goal]]
when = { groups = ["clinician"] }
table = [["decide what to do for a patient", 36], ["understand how something works", 13], ["check whether a claim is true", 18],
  ["find a method or protocol", 9], ["find a number to cite", 13], ["find an image to show a patient or colleague", 11]]
[[personas.attrs.goal]]
when = { groups = ["researcher"] }
table = [["understand how something works", 22], ["check whether a claim is true", 9], ["find a method or protocol", 22],
  ["gather evidence for a review, paper or grant", 22], ["find a number to cite", 13], ["compare a figure with their own results", 12]]
[[personas.attrs.goal]]
table = [["decide what to do for a patient or for themself", 10], ["understand how something works", 20],
  ["check whether a claim is true", 15], ["find a method or protocol", 12], ["gather evidence for a review, paper or grant", 13],
  ["find a number to cite", 10], ["find an image or diagram to explain something", 12], ["see what something looks like", 8]]

