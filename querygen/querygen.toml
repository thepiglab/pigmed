# PigMed query generator config, recipe v3.2 = v3.1e (domain rule, lay pass, field->role fallback; `extends`)
# + wider personas. Spec: docs/QUERYGEN_SPEC.md. Chain: v3.1d.toml <- fig.toml <- v3.1e.toml <- querygen.toml.
#
# Merge rule for `extends`: tables merge key by key; any key given here (arrays included) replaces the parent's.
# `personas.extra_roles` is appended to the parent's roles.

extends = "v3.1e.toml"
recipe = "v3.2"

# ------------------------------------------------------------------------------------------------ wider personas
[personas]
