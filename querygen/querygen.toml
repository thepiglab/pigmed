[[personas.attrs.age]]
when = { roles = ["high-school student", "teenager looking up symptoms"] }
fixed = "16-19"
[[personas.attrs.age]]
when = { roles = ["retired nurse"] }
fixed = "65+"
[[personas.attrs.age]]
when = { roles = ["undergraduate biology student", "medical student", "nursing student", "pharmacy student", "PhD student",
  "biomedical science undergraduate", "dental student", "physiotherapy student", "veterinary student", "paramedic student",
  "psychology undergraduate", "nutrition student"] }
table = [["20-29", 85], ["30-44", 15]]
[[personas.attrs.age]]
when = { groups = ["lay"], role_contains = "elderly parent" }
table = [["30-44", 30], ["45-64", 70]]
[[personas.attrs.age]]
when = { roles = ["pregnant person", "new parent"] }
table = [["20-29", 45], ["30-44", 55]]
[[personas.attrs.age]]
