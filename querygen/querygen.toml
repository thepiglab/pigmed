[[hints.l2_slips]]
l1 = ["Spanish", "Portuguese", "French", "Italian", "Romanian"]
slips = "extra or wrong articles (\"the diabetes\"), adjective after the noun, false friends (\"actual\" for current, \"realize a study\"), \"make\" for \"do\""
[[hints.l2_slips]]
l1 = ["Hindi", "Bengali", "Tagalog", "Urdu", "Nepali", "Tamil", "Telugu"]
slips = "wrong prepositions (\"discuss about\", \"effect for\"), progressive verbs (\"is having\"), dropped or extra articles, \"itself\"/\"only\" for emphasis"
[[hints.l2_slips]]
l1 = ["Arabic", "Turkish", "Swahili", "Persian", "Somali", "Amharic"]
slips = "dropped \"is/are\", wrong prepositions, missing articles, question without inversion (\"why the drug cause...\")"
[[hints.l2_slips]]
l1 = ["Vietnamese", "Korean", "Japanese", "Mandarin", "Cantonese", "Thai", "Indonesian", "Malay"]
slips = "missing articles and plural -s, no past tense, topic first (\"diabetes, which drug better\")"
[[hints.l2_slips]]
l1 = ["Russian", "German", "Polish", "Ukrainian", "Dutch", "Greek"]
slips = "missing articles, unusual word order (verb late), \"since 3 years\", literal phrasing"
[[hints.l2_slips]]
l1 = ["Yoruba", "Hausa", "Igbo"]
slips = "uncountable nouns made plural (\"informations\", \"researches\"), dropped articles, \"is it\" as a tag question, \"been\" for past tense"
[[hints.l2_slips]]
l1 = []
slips = "missing articles, wrong prepositions, unusual word order"
