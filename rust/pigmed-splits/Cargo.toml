[package]
name = "pigmed-splits"
version = "0.1.0"
edition = "2021"
description = "PigMed retriever data: JATS paper metadata census, leakage-safe paper-group splits, audit (docs/RETRIEVER_DATA_PLAN.md)"
license = "MIT"

[[bin]]
name = "pigmed-splits"
path = "src/main.rs"

[features]
default = ["tokens"]
# EG2 token counts in the census (HF tokenizers; needs a C compiler for onig)
tokens = ["dep:tokenizers"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
rayon = "1"
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
