[package]
name = "pigmed-synth"
version = "0.1.0"
edition = "2021"
description = "PigMed synthetic-query A/B: sample chunks, call an OpenAI-compatible LLM server, EG2 round-trip filter, report (docs/RETRIEVER_DATA_PLAN.md)"
license = "MIT"

[[bin]]
name = "pigmed-synth"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow-array = "60"
arrow-schema = "60"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
base64 = "0.22"
half = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
roxmltree = "0.20"
hex = "0.4"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
