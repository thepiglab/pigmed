[package]
name = "pigmed-querygen"
version = "0.1.0"
edition = "2021"
description = "PigMed synthetic-query generator: config-driven personas, intent cards, surface queries, figure arm (querygen/querygen.toml)"
license = "MIT"

[lib]
name = "querygen"
path = "src/lib.rs"

[[bin]]
name = "pigmed-querygen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
