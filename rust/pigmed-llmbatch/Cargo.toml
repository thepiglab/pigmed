[package]
name = "pigmed-llmbatch"
version = "0.1.0"
edition = "2021"
description = "Resumable batch client for an OpenAI-compatible chat server (vLLM/SGLang): tasks JSONL in, results JSONL out"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
