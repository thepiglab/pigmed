[package]
name = "pigmed-export"
version = "0.1.0"
edition = "2021"
description = "PigMed: export embedded bundles (rows + EmbeddingGemma 2 vectors) to Parquet shards (chunks / vectors / media)"
license = "MIT"

[[bin]]
name = "pigmed-export"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow = { version = "55", default-features = false }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
half = "2"
hex = "0.4"
parquet = { version = "55", default-features = false, features = ["arrow", "zstd"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
